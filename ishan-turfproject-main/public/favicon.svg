<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Card Background for PWA Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="3"/>

  <!-- Logo Mark Group -->
  <g transform="translate(48, 30)">
    <!-- Green Swoosh Arc around Batsman -->
    <path d="M 120 220 C 90 90 240 40 350 90 C 410 118 435 185 400 260 C 370 325 280 375 190 380" 
          fill="none" stroke="url(#greenGrad)" stroke-width="26" stroke-linecap="round" filter="url(#shadow)" />

    <!-- Batsman Silhouette (White) -->
    <!-- Helmet / Head -->
    <circle cx="230" cy="180" r="22" fill="#ffffff" />
    
    <!-- Upper Body & Shoulders -->
    <path d="M 215 205 C 195 220 180 245 170 275 L 200 282 C 210 255 222 235 235 220 L 270 245 L 285 230 Z" fill="#ffffff" />
    
    <!-- Back Leg -->
    <path d="M 175 275 L 142 360 L 122 365 L 152 375 L 195 285 Z" fill="#ffffff" />
    
    <!-- Front Leg -->
    <path d="M 215 272 L 235 355 L 220 365 L 250 370 L 235 280 Z" fill="#ffffff" />
    
    <!-- Cricket Bat (Green) -->
    <path d="M 270 235 L 130 135 L 148 119 L 286 215 Z" fill="url(#greenGrad)" />
  </g>
</svg>