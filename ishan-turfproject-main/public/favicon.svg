<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#0d1f12"/>
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Black rounded background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Subtle green border -->
  <rect width="502" height="502" x="5" y="5" rx="91" fill="none" stroke="#22c55e" stroke-width="3" stroke-opacity="0.35"/>

  <!-- === BATSMAN + SWOOSH MARK (centered, scaled up) === -->
  <!-- Scale: roughly 2.1x with center-offset -->
  <g transform="translate(100, 28) scale(2.1)">

    <!-- Green Swoosh Arc — large C-curve around batsman -->
    <path d="M 72 12 C 18 18 -2 62 10 105 C 20 142 52 164 88 162 C 120 160 148 138 150 106 C 152 76 128 52 98 50 C 74 50 58 68 62 88 C 66 106 84 114 98 106 C 110 100 112 84 100 78"
          fill="none" stroke="url(#swooshGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- White Batsman Silhouette -->
    <!-- Head with helmet -->
    <circle cx="100" cy="58" r="11" fill="#ffffff"/>
    <!-- Helmet peak -->
    <path d="M 90 54 C 88 50 93 44 104 44 C 114 44 118 52 114 58 Z" fill="#22c55e"/>
    <!-- Body / torso -->
    <path d="M 92 70 C 82 80 74 96 70 114 L 84 118 L 98 90 L 120 102 L 128 92 Z" fill="#ffffff"/>
    <!-- Back leg -->
    <path d="M 70 114 L 54 158 L 42 160 L 56 166 L 78 118 Z" fill="#ffffff"/>
    <!-- Front leg with pads -->
    <path d="M 92 112 L 102 158 L 92 162 L 110 166 L 104 114 Z" fill="#ffffff"/>
    <!-- Bat — diagonal up-left strike -->
    <path d="M 120 92 L 44 34 L 54 24 L 130 82 Z" fill="url(#swooshGrad)"/>
  </g>

  <!-- ELITE text -->
  <text x="256" y="398" text-anchor="middle" fill="#ffffff"
        font-family="'Cinzel', 'Georgia', 'Times New Roman', serif"
        font-weight="900" font-size="82" letter-spacing="5">ELITE</text>

  <!-- ARENA text -->
  <text x="256" y="472" text-anchor="middle" fill="#22c55e"
        font-family="'Cinzel', 'Georgia', 'Times New Roman', serif"
        font-weight="900" font-size="52" letter-spacing="8">ARENA</text>
</svg>
